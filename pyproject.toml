[project]
name = "piano"
version = "0.1.0"
description = "Arduino serial key matrix to virtual MIDI keyboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mido>=1.3,<2",
    "pyserial>=3.5,<4",
    "python-rtmidi>=1.5,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
